# Golden timeline valve_ctrl (M2 §7.4/§11.1, P2.3 — bảng C, STATE §26).
# Quy ước (OQ-254): cmd/fault áp SAU engine.step(t); expect kiểm sau step(t).
# stroke 20s → 0.05%/bước; deadband 0.5; posFb lagMs=0 → bám ngay.
# Bẫy deadband (bảng C): pos dừng ở 79.5, KHÔNG đạt 80 (|80−79.5|=0.5 ≤ 0.5).
# LƯU Ý (OQ-303): bảng C plan ghim 79.55 với ref exact 80; thực tế posRef 80
# qua AO lượng tử hóa raw 22118 → eng 79.9986 nên deadband dừng sớm hơn
# một bước (79.5). Tương tự signalLoss close dừng ở 0.5 (deadband giữ).
model: valve_ctrl
stepMs: 10
seed: 42
cases:
  - id: base-stroke
    description: posRef=80 — ramp 0.05%/bước, dừng trong deadband ở 79.55 (bảng C)
    steps:
      - t: 0
        expect: { posPct: 0, posFb: 0, targetPct: 0, closedLs: true, openLs: false, fault: false }
      - t: 100
        cmd: { posRef: 80 }
        expect: { posPct: 0, targetPct: 0 }
      - t: 110
        expect: { posPct: 0.05, posFb: 0.05, targetPct: 80 }
      - t: 8100
        expect: { posPct: 40, posFb: 40, targetPct: 80 }
      - t: 16100
        expect: { posPct: 79.5, posFb: 79.5, targetPct: 79.5, closedLs: false, openLs: false }

  - id: deadband
    description: Đổi posRef trong deadband → target giữ; đổi ra ngoài → chạy tiếp
    steps:
      - t: 0
        expect: { posPct: 0 }
      - t: 100
        cmd: { posRef: 80 }
      - t: 16100
        expect: { posPct: 79.5, targetPct: 79.5 }
      - t: 16200
        cmd: { posRef: 79.8 }
        expect: { posPct: 79.5, targetPct: 79.5 }
      - t: 16300
        expect: { posPct: 79.5, targetPct: 79.5 }
      - t: 17000
        cmd: { posRef: 80.5 }
        expect: { posPct: 79.5, targetPct: 79.5 }
      - t: 17100
        expect: { posPct: 80, targetPct: 80.5 }

  - id: stuck
    description: stuck đóng băng pos; clear xong chạy tiếp
    steps:
      - t: 0
        expect: { posPct: 0 }
      - t: 100
        cmd: { posRef: 80 }
      - t: 1000
        fault: { id: stuck }
        expect: { posPct: 4.5, targetPct: 80 }
      - t: 1010
        expect: { posPct: 4.5, targetPct: 80, fault: true }
      - t: 5000
        expect: { posPct: 4.5, fault: true }
      - t: 6000
        fault: { clear: stuck }
        expect: { posPct: 4.5, fault: true }
      - t: 6010
        expect: { posPct: 4.55, targetPct: 80, fault: false }

  - id: drift
    description: drift +3600%/h — trôi 0.01%/bước sau rate-limit (OQ-281)
    steps:
      - t: 0
        expect: { posPct: 0 }
      - t: 100
        cmd: { posRef: 80 }
      - t: 1000
        fault: { id: drift, params: { pctPerHour: 3600 } }
        expect: { posPct: 4.5, targetPct: 80 }
      - t: 2000
        expect: { posPct: 10.5, targetPct: 80, fault: true }

  - id: positioner-fail
    description: positionerFail — posFb đóng băng, target latch, pos thật chạy tiếp (OQ-282)
    steps:
      - t: 0
        expect: { posPct: 0, posFb: 0 }
      - t: 100
        cmd: { posRef: 80 }
      - t: 1000
        fault: { id: positionerFail }
        expect: { posPct: 4.5, posFb: 4.5, targetPct: 80 }
      - t: 1010
        expect: { posPct: 4.55, posFb: 4.5, targetPct: 80, fault: true }
      - t: 2000
        cmd: { posRef: 20 }
        expect: { posPct: 9.5, posFb: 4.5, targetPct: 80 }
      - t: 3000
        expect: { posPct: 14.5, posFb: 4.5, targetPct: 80 }
      - t: 4000
        fault: { clear: positionerFail }
        expect: { posPct: 19.5, posFb: 4.5, fault: true }
      - t: 4010
        expect: { posPct: 19.55, posFb: 19.55, targetPct: 20, fault: false }

  - id: signal-loss
    description: signalLoss — failPosition=close → target 0; clear xong về 80 (OQ-283)
    params:
      failPosition: close
    steps:
      - t: 0
        expect: { posPct: 0 }
      - t: 100
        cmd: { posRef: 80 }
      - t: 1000
        fault: { id: signalLoss }
        expect: { posPct: 4.5, targetPct: 80 }
      - t: 1010
        expect: { posPct: 4.45, targetPct: 0, fault: true }
      - t: 2000
        expect: { posPct: 0.5, posFb: 0.5, targetPct: 0.5, fault: true }
      - t: 3000
        fault: { clear: signalLoss }
        expect: { posPct: 0.5, targetPct: 0.5, fault: true }
      - t: 3010
        expect: { posPct: 0.55, targetPct: 80, fault: false }
