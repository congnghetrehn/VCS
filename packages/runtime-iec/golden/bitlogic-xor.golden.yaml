id: bitlogic-xor
description: "XOR hai input (đổi trạng thái khi một trong hai đổi)"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        %Q0.0 := %I0.0 XOR %I0.1;
      END_ORGANIZATION_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%Q0.0": false } }
  - { t: 10, set: { "%I0.0": true }, expect: { "%Q0.0": true } }
  - { t: 20, set: { "%I0.1": true }, expect: { "%Q0.0": false } }
  - { t: 30, set: { "%I0.0": false }, expect: { "%Q0.0": true } }
  - { t: 40, set: { "%I0.1": false }, expect: { "%Q0.0": false } }
