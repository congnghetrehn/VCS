id: lad-series-nc
description: "LAD series NO + NC: Q0.0 = I0.0 AND NOT I0.1"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.lad.json
    text: |
      {
        "kind": "OB",
        "name": "Main",
        "interface": {},
        "networks": [
          {
            "id": "N1",
            "rung": [
              {
                "t": "contact",
                "mode": "NO",
                "operand": {
                  "abs": "%I0.0"
                }
              },
              {
                "t": "contact",
                "mode": "NC",
                "operand": {
                  "abs": "%I0.1"
                }
              },
              {
                "t": "coil",
                "mode": "normal",
                "operand": {
                  "abs": "%Q0.0"
                }
              }
            ]
          }
        ]
      }
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%Q0.0": false } }
  - { t: 10, set: { "%I0.0": true }, expect: { "%Q0.0": true } }
  - { t: 20, set: { "%I0.1": true }, expect: { "%Q0.0": false } }
  - { t: 30, set: { "%I0.0": false, "%I0.1": false }, expect: { "%Q0.0": false } }
