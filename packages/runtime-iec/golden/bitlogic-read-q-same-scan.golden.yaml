id: bitlogic-read-q-same-scan
description: "Đọc lại %Q trong cùng scan sau khi ghi (PIQ) — hành vi hiện tại của bộ nhớ trực tiếp; UNVERIFIED so với TIA (M1 §14 mục 10)"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        %Q0.0 := %I0.0 OR %Q0.0;
      END_ORGANIZATION_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%Q0.0": false } }
  - { t: 10, set: { "%I0.0": true }, expect: { "%Q0.0": true } }
  - { t: 20, set: { "%I0.0": false }, expect: { "%Q0.0": true } }
  - { t: 30, set: { "%I0.0": false }, expect: { "%Q0.0": true } }
