id: bitlogic-set-reset
description: "Latch set/reset bằng IF; set rồi reset cùng scan -> reset thắng (thứ tự câu lệnh)"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        IF %I0.0 THEN
          %Q0.0 := TRUE;
        END_IF;
        IF %I0.1 THEN
          %Q0.0 := FALSE;
        END_IF;
      END_ORGANIZATION_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%Q0.0": false } }
  - { t: 10, set: { "%I0.0": true }, expect: { "%Q0.0": true } }
  - { t: 20, set: { "%I0.0": false }, expect: { "%Q0.0": true } }
  - { t: 30, set: { "%I0.1": true }, expect: { "%Q0.0": false } }
  - { t: 40, set: { "%I0.0": true }, expect: { "%Q0.0": false } }
