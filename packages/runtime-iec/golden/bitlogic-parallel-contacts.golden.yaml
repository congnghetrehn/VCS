id: bitlogic-parallel-contacts
description: "3 contact song song (OR); chạy khi bất kỳ contact nào true"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        %Q0.0 := %I0.0 OR %I0.1 OR %I0.2;
      END_ORGANIZATION_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%Q0.0": false } }
  - { t: 10, set: { "%I0.1": true }, expect: { "%Q0.0": true } }
  - { t: 20, set: { "%I0.1": false, "%I0.2": true }, expect: { "%Q0.0": true } }
  - { t: 30, set: { "%I0.2": false }, expect: { "%Q0.0": false } }
