id: timer-tof-retrigger
description: "TOF retrigger (bảng F1): IN lên giữa chừng hủy đếm, cạnh xuống mới đếm lại; cạnh xuống tại t=200 và t=2000"
expectedFrom: spec
config: { scanPeriodMs: 100 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        "T1"(IN := %M0.0, PT := T#2s);
        %M1.0 := "T1".Q;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "T1" "TOF"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 100, set: { "%M0.0": true }, expect: { "%M1.0": true, '"T1".ET': 0 } }
  - { t: 200, set: { "%M0.0": false }, expect: { "%M1.0": true, '"T1".ET': 0 } }
  - { t: 1400, expect: { "%M1.0": true, '"T1".ET': 1200 } }
  - { t: 1500, set: { "%M0.0": true }, expect: { "%M1.0": true, '"T1".ET': 0 } }
  - { t: 1900, expect: { "%M1.0": true, '"T1".ET': 0 } }
  - { t: 2000, set: { "%M0.0": false }, expect: { "%M1.0": true, '"T1".ET': 0 } }
  - { t: 4000, expect: { "%M1.0": false, '"T1".ET': 2000 } }
