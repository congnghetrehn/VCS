id: timer-ton-oscillating
description: "TON IN dao động PT=1000 (bảng C1): xuống -> reset, đếm lại từ đầu; bước liên tiếp 100ms (1 scan/step)"
expectedFrom: spec
config: { scanPeriodMs: 100 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        "T1"(IN := %M0.0, PT := T#1s);
        %M1.0 := "T1".Q;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "T1" "TON"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 100, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 200, set: { "%M0.0": true }, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 300, expect: { "%M1.0": false, '"T1".ET': 100 } }
  - { t: 400, expect: { "%M1.0": false, '"T1".ET': 200 } }
  - { t: 500, set: { "%M0.0": false }, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 600, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 700, set: { "%M0.0": true }, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 800, expect: { "%M1.0": false, '"T1".ET': 100 } }
  - { t: 1600, expect: { "%M1.0": false, '"T1".ET': 900 } }
  - { t: 1700, expect: { "%M1.0": true, '"T1".ET': 1000 } }
