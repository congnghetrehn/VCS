id: timer-tp-retrigger-ignored
description: "TP cạnh lên trong lúc phát xung bị bỏ qua, xung kết thúc đúng t=1200 (bảng H1); bước liên tiếp 100ms"
expectedFrom: spec
config: { scanPeriodMs: 100 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        "T1"(IN := %M0.0, PT := T#1s);
        %M1.0 := "T1".Q;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "T1" "TP"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 100, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 200, set: { "%M0.0": true }, expect: { "%M1.0": true, '"T1".ET': 0 } }
  - { t: 300, expect: { "%M1.0": true, '"T1".ET': 100 } }
  - { t: 400, set: { "%M0.0": false }, expect: { "%M1.0": true, '"T1".ET': 200 } }
  - { t: 600, set: { "%M0.0": true }, expect: { "%M1.0": true, '"T1".ET': 400 } }
  - { t: 1100, expect: { "%M1.0": true, '"T1".ET': 900 } }
  - { t: 1200, expect: { "%M1.0": false, '"T1".ET': 1000 } }
