id: timer-tof-basic
description: "TOF PT=2000 (bảng E1): cạnh xuống đếm, Q=false ở elapsed=2000, ET giữ PT; cạnh xuống tại scan t=200"
expectedFrom: spec
config: { scanPeriodMs: 100 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        "T1"(IN := %M0.0, PT := T#2s);
        %M1.0 := "T1".Q;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "T1" "TOF"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 100, set: { "%M0.0": true }, expect: { "%M1.0": true, '"T1".ET': 0 } }
  - { t: 200, set: { "%M0.0": false }, expect: { "%M1.0": true, '"T1".ET': 0 } }
  - { t: 500, expect: { "%M1.0": true, '"T1".ET': 300 } }
  - { t: 1500, expect: { "%M1.0": true, '"T1".ET': 1300 } }
  - { t: 2100, expect: { "%M1.0": true, '"T1".ET': 1900 } }
  - { t: 2200, expect: { "%M1.0": false, '"T1".ET': 2000 } }
  - { t: 2300, expect: { "%M1.0": false, '"T1".ET': 2000 } }
  - { t: 3000, set: { "%M0.0": true }, expect: { "%M1.0": true, '"T1".ET': 0 } }
