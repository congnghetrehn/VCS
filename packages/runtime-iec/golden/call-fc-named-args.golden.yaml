id: call-fc-named-args
description: "FC_Add đối số tên: a:=10, b:=-3 -> 7"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        %MW10 := "FC_Add"(a := 10, b := -3);
      END_ORGANIZATION_BLOCK
  - file: fc.scl
    text: |
      FUNCTION "FC_Add" : Int
      VAR_INPUT
        a : Int;
        b : Int;
      END_VAR
      BEGIN
        "FC_Add" := #a + #b;
      END_FUNCTION
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%MW10": 0 } }
  - { t: 10, expect: { "%MW10": 7 } }
