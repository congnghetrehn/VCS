id: flow-for-by-step
description: "FOR 10 TO 0 BY -2 cộng dồn: 10+8+6+4+2+0=30"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      VAR_TEMP
        i : Int;
        s : Int;
      END_VAR
      BEGIN
        #s := 0;
        FOR #i := 10 TO 0 BY -2 DO
          #s := #s + #i;
        END_FOR;
        %MW10 := #s;
      END_ORGANIZATION_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%MW10": 0 } }
  - { t: 10, expect: { "%MW10": 30 } }
