id: lad-parallel
description: "LAD parallel: I0.0 OR I0.1 -> Q0.0"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.lad.json
    text: |
      {
        "kind": "OB",
        "name": "Main",
        "interface": {},
        "networks": [
          {
            "id": "N1",
            "rung": [
              {
                "t": "parallel",
                "branches": [
                  [
                    {
                      "t": "contact",
                      "mode": "NO",
                      "operand": {
                        "abs": "%I0.0"
                      }
                    }
                  ],
                  [
                    {
                      "t": "contact",
                      "mode": "NO",
                      "operand": {
                        "abs": "%I0.1"
                      }
                    }
                  ]
                ]
              },
              {
                "t": "coil",
                "mode": "normal",
                "operand": {
                  "abs": "%Q0.0"
                }
              }
            ]
          }
        ]
      }
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%Q0.0": false } }
  - { t: 10, set: { "%I0.0": true }, expect: { "%Q0.0": true } }
  - { t: 20, set: { "%I0.0": false, "%I0.1": true }, expect: { "%Q0.0": true } }
  - { t: 30, set: { "%I0.1": false }, expect: { "%Q0.0": false } }
