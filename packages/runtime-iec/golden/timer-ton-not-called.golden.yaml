id: timer-ton-not-called
description: "TON không được gọi vài scan (bảng D1, OQ-169): ET nhảy theo timestamp khi gọi lại"
expectedFrom: spec
config: { scanPeriodMs: 100 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        IF %M0.1 THEN
          "T1"(IN := %M0.0, PT := T#2s);
        END_IF;
        %M1.0 := "T1".Q;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "T1" "TON"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, set: { "%M0.1": true }, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 100, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 200, set: { "%M0.0": true }, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 300, set: { "%M0.1": false }, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 1500, expect: { "%M1.0": false, '"T1".ET': 0 } }
  - { t: 1600, set: { "%M0.1": true }, expect: { "%M1.0": false, '"T1".ET': 1400 } }
  - { t: 2200, expect: { "%M1.0": true, '"T1".ET': 2000 } }
