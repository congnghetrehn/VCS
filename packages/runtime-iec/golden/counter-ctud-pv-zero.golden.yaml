id: counter-ctud-pv-zero
description: "CTUD PV=0 (bảng N4): CV=0 -> QU và QD cùng true"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        "C1"(CU := %M0.0, CD := %M0.1, R := %M0.2, LD := %M0.3, PV := 0);
        %MW10 := "C1".CV;
        %Q0.0 := "C1".QU;
        %Q0.1 := "C1".QD;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "C1" "CTUD"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%MW10": 0, "%Q0.0": false, "%Q0.1": false } }
  - { t: 10, expect: { "%MW10": 0, "%Q0.0": true, "%Q0.1": true } }
  - { t: 20, set: { "%M0.0": true }, expect: { "%MW10": 1, "%Q0.0": true, "%Q0.1": false } }
