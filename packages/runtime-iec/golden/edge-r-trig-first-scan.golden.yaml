id: edge-r-trig-first-scan
description: "R_TRIG bảng J3: scan đầu sau load, CLK=true -> Q=true (cạnh lên so với trạng thái đầu false)"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        "T1"(CLK := %M0.0);
        %Q0.0 := "T1".Q;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "T1" "R_TRIG"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, set: { "%M0.0": true }, expect: { "%Q0.0": false } }
  - { t: 10, expect: { "%Q0.0": true } }
  - { t: 20, expect: { "%Q0.0": false } }
