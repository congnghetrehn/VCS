id: bitlogic-mixed-precedence
description: "Độ ưu tiên AND > OR: (I0 AND I1) OR (I2 AND NOT I3)"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        %Q0.0 := %I0.0 AND %I0.1 OR %I0.2 AND NOT %I0.3;
      END_ORGANIZATION_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%Q0.0": false } }
  - { t: 10, set: { "%I0.0": true, "%I0.1": true }, expect: { "%Q0.0": true } }
  - { t: 20, set: { "%I0.0": false, "%I0.1": false, "%I0.2": true, "%I0.3": true }, expect: { "%Q0.0": false } }
  - { t: 30, set: { "%I0.3": false }, expect: { "%Q0.0": true } }
  - { t: 40, set: { "%I0.0": true, "%I0.2": false }, expect: { "%Q0.0": false } }
