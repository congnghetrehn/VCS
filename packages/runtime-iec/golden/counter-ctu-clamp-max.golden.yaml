id: counter-ctu-clamp-max
description: "CTU kẹp max (bảng L3): CV=32767 + cạnh lên -> giữ 32767, QU=true"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        "C1"(CU := %M0.0, R := %M0.1, PV := 3);
        %MW10 := "C1".CV;
        %Q0.0 := "C1".QU;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "C1" "CTU"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, set: { '"C1".CV': 32767 }, expect: { "%MW10": 0, "%Q0.0": false } }
  - { t: 10, set: { "%M0.0": true }, expect: { "%MW10": 32767, "%Q0.0": true } }
  - { t: 20, set: { "%M0.1": true }, expect: { "%MW10": 0, "%Q0.0": false } }
