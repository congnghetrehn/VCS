id: counter-ctd-clamp-min
description: "CTD kẹp min (bảng M3): CV=-32768 + cạnh xuống -> giữ -32768, QD=true"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        "C1"(CD := %M0.0, LD := %M0.1, PV := 3);
        %MW10 := "C1".CV;
        %Q0.0 := "C1".QD;
      END_ORGANIZATION_BLOCK
  - file: db.scl
    text: |
      DATA_BLOCK "C1" "CTD"
      BEGIN
      END_DATA_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, set: { '"C1".CV': -32768 }, expect: { "%MW10": 0, "%Q0.0": false } }
  - { t: 10, set: { "%M0.0": true }, expect: { "%MW10": -32768, "%Q0.0": true } }
