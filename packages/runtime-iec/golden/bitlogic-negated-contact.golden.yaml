id: bitlogic-negated-contact
description: "Contact thường đóng (NOT); NC true = bình thường, mất tín hiệu -> chạy"
expectedFrom: spec
config: { scanPeriodMs: 10 }
sources:
  - file: main.scl
    text: |
      ORGANIZATION_BLOCK "Main"
      BEGIN
        %Q0.0 := NOT %I0.0;
      END_ORGANIZATION_BLOCK
organization: [{ ob: 1 }]
steps:
  - { t: 0, expect: { "%Q0.0": false } }
  - { t: 10, set: { "%I0.0": true }, expect: { "%Q0.0": false } }
  - { t: 20, set: { "%I0.0": false }, expect: { "%Q0.0": true } }
