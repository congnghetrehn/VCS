# CI — VCS (M0 §13, sửa bởi AMENDMENTS A16: chỉ Node 22). Chạy trên push + PR.
# Job test (P0.7, M0 §13): `pnpm test` chạy kèm `--coverage` (provider v8),
# ngưỡng dòng: kernel/schemas ≥ 85%, project ≥ 80% (vitest.config.ts).
# Job bench (P0.3, M0 §13 + OQ-008, P0.7 + OQ-073): chạy tay/nightly, upload
# artifact `bench/results.json`; so sánh hồi quy > 20% với `bench/baseline.json`
# bằng scripts/check-bench-regression.mjs → chỉ cảnh báo (::warning::), không fail.
# Job e2e (P0.6, M0 §13 + OQ-008 phần e2e): ubuntu,
# build web + Playwright chromium, upload trace khi lỗi.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  check:
    name: check (lint, typecheck, depcheck, diagnostics, cheats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcheck
      - run: pnpm docs:diagnostics --check
      - run: pnpm docs:equipment --check
      - run: pnpm review:cheats

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: e2e (ubuntu, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results/

  bench:
    name: bench (manual/nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench
      - run: node scripts/check-bench-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results.json
