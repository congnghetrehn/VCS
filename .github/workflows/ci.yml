# CI — VCS (M0 §13, sửa bởi AMENDMENTS A16: chỉ Node 22).
# Tiết kiệm phút Actions (gói A, 2026-11-26 — tài khoản free 2000 phút/tháng
# đã hết 100% ngày 2026-11-26; mỗi commit trên nhánh PR từng tốn ~25 phút):
# - push chỉ chạy trên develop/main. Commit trên nhánh feature KHÔNG chạy CI
#   qua push nữa; khi PR đã mở, sự kiện pull_request chạy 1 lượt thay vì 2.
#   Đẩy lên nhánh chat-logs (cron log) cũng không tốn phút nào.
# - concurrency cancel-in-progress: commit mới hủy lượt chạy cũ cùng ref
#   (browser upload theo batch nhiều commit liên tiếp chỉ chạy lượt cuối).
# - test Windows (hệ số tính phí ×2 — job đắt nhất mỗi lượt) chỉ chạy khi
#   push lên develop/main, chạy tay, hoặc PR nhắm vào main (giữ đủ 4 check
#   bắt buộc của D-001 trên main: check / test ubuntu / test windows / e2e).
#   PR vào develop chạy check + test ubuntu + e2e; lỗi chỉ-Windows sẽ lộ
#   ở lượt chạy sau merge vào develop.
# - schedule nightly chỉ còn chạy bench (check/test/e2e không chạy khi
#   không có code mới).
# Job test (P0.7, M0 §13): `pnpm test` chạy kèm `--coverage` (provider v8),
# ngưỡng dòng: kernel/schemas ≥ 85%, project ≥ 80% (vitest.config.ts).
# Job bench (P0.3, M0 §13 + OQ-008, P0.7 + OQ-073): chạy tay/nightly, upload
# artifact `bench/results.json`; so sánh hồi quy > 20% với `bench/baseline.json`
# bằng scripts/check-bench-regression.mjs → chỉ cảnh báo (::warning::), không fail.
# Job e2e (P0.6, M0 §13 + OQ-008 phần e2e): ubuntu,
# build web + Playwright chromium, upload trace khi lỗi.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (lint, typecheck, depcheck, diagnostics, cheats)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcheck
      - run: pnpm docs:diagnostics --check
      - run: pnpm docs:equipment --check
      - run: pnpm review:cheats

  test:
    name: test (ubuntu-latest, node 22)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-windows:
    name: test (windows-latest, node 22)
    # Chỉ chạy khi push lên develop/main, chạy tay, hoặc PR nhắm vào main
    # (đủ check bắt buộc D-001 trên main). PR vào develop không chạy job này.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: e2e (ubuntu, node 22)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results/

  bench:
    name: bench (manual/nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench
      - run: node scripts/check-bench-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results.json
